{% extends 'base_landing.html' %}

{% block auth_content %}
<div class="text-center mb-4">
    <i class="fas fa-rocket fa-3x text-primary mb-3"></i>
    <h2 class="fw-bold text-white ls-1">Create Account</h2>
    <p class="text-muted small">Join us and streamline your portfolio tracking.</p>
</div>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary fw-bold py-2">Sign in</button>
    </div>
</form>

<div class="text-center mt-5">
    <span class="text-muted small">Already have an account?</span>
    <a href="{% url 'login' %}" class="text-primary fw-bold text-decoration-none ms-1">Log in</a>
</div>
{% endblock %}
