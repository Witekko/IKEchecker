{% extends 'base_landing.html' %}

{% block auth_content %}
<div class="text-center mb-5">
    <i class="fas fa-chart-line fa-3x text-success mb-3"></i>
    <h2 class="fw-bold text-white ls-1">IKE Tracker</h2>
    <p class="text-muted small">Welcome back. Enter your credentials to continue.</p>
</div>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="text-muted small text-uppercase fw-bold mb-1">Username</label>
        <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required autofocus>
    </div>

    <div class="mb-4">
        <label class="text-muted small text-uppercase fw-bold mb-1">Password</label>
        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success fw-bold py-2">Log in</button>
    </div>
    <div class="position-relative my-4">
        <hr class="border-secondary opacity-25">
        <span class="position-absolute top-50 start-50 translate-middle px-2 text-muted small fw-bold" style="background-color: #0d0d0d;">OR</span>
    </div>

    {% load socialaccount %}
    <div class="d-grid gap-2 mb-3">
        <a href="{% provider_login_url 'google' %}" class="btn btn-light fw-bold py-2 d-flex align-items-center justify-content-center text-dark border-0 shadow-sm" style="transition: all 0.2s ease-in-out;">
            <svg class="me-2" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="width: 1rem; height: 1rem;">
                <path d="M15.545 6.558a9.42 9.42 0 0 1 .139 1.626c0 2.434-.87 4.492-2.384 5.885h.002C11.978 15.292 10.158 16 8 16A8 8 0 1 1 8 0c2.2 0 4.059.812 5.522 2.167l-2.26 2.26c-1.579-1.517-4.545-2.626-5.522-.723-.715 1.4-1.258 3.19-.715 4.59.54 1.4 2.2 2.324 3.712 2.324 1.83 0 3.22-.8 3.901-2.02a3.24 3.24 0 0 0 .405-1.48H8v-2.99h7.545z"/>
            </svg>
            Sign in with Google
        </a>
        <a href="{% url 'demo_login' %}" class="btn btn-outline-warning fw-bold py-2">
            <i class="fas fa-user-secret me-2"></i> Try DEMO
        </a>
    </div>
</form>

<div class="text-center mt-5">
    <span class="text-muted small">Don't have an account?</span>
    <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none ms-1">Sign up</a>
</div>
{% endblock %}
