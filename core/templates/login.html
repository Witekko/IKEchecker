{% extends 'base_landing.html' %}

{% block auth_content %}
<div class="text-center mb-5">
    <i class="fas fa-chart-line fa-3x text-success mb-3"></i>
    <h2 class="fw-bold text-white ls-1">IKE Tracker</h2>
    <p class="text-muted small">Welcome back. Enter your credentials to continue.</p>
</div>

<form method="post">
    {% csrf_token %}

    <div class="mb-3">
        <label class="text-muted small text-uppercase fw-bold mb-1">Username or Email</label>
        <input type="text" name="login" class="form-control bg-dark text-white border-secondary" required autofocus>
    </div>

    <div class="mb-4">
        <label class="text-muted small text-uppercase fw-bold mb-1">Password</label>
        <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
    </div>

    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success fw-bold py-2">Log in</button>
    </div>
    <div class="position-relative my-4">
        <hr class="border-secondary opacity-25">
        <span class="position-absolute top-50 start-50 translate-middle px-2 text-muted small fw-bold" style="background-color: #0d0d0d;">OR</span>
    </div>

    {% load socialaccount %}
    <div class="d-grid gap-2 mb-3">
        <a href="{% provider_login_url 'google' %}" class="btn btn-outline-light fw-bold py-2 d-flex align-items-center justify-content-center bg-dark bg-opacity-25 border-secondary text-white" style="transition: all 0.2s ease-in-out; border-color: rgba(255, 255, 255, 0.15) !important;">
            <svg class="me-2" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 48 48" style="width: 1.1rem; height: 1.1rem;">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24c0-1.61-.15-3.16-.42-4.67H24v8.83h12.68c-.55 2.92-2.2 5.4-4.68 7.07l7.26 5.63C43.53 36.31 46.5 30.65 46.5 24z"/>
                <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.56 10.78l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.26-5.63c-2.03 1.36-4.62 2.19-8.63 2.19-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Sign in with Google
        </a>
        <a href="{% url 'demo_login' %}" class="btn btn-outline-warning fw-bold py-2">
            <i class="fas fa-user-secret me-2"></i> Try DEMO
        </a>
    </div>
</form>

<div class="text-center mt-5">
    <span class="text-muted small">Don't have an account?</span>
    <a href="{% url 'register' %}" class="text-success fw-bold text-decoration-none ms-1">Sign up</a>
</div>
{% endblock %}
