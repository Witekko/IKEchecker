{% extends 'base_landing.html' %}
{% load static %}

{% block auth_content %}
<div class="text-center mb-4">
    <div class="rounded-circle bg-success bg-opacity-10 d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px;">
        <i class="fas fa-check-double fa-2x text-success"></i>
    </div>
    <h3 class="fw-bold text-white mb-2">Password Changed</h3>
    <p class="text-muted small">Your password has been successfully updated.</p>
</div>

<div class="alert alert-success py-3 small border-0 bg-success bg-opacity-10 text-success mb-4 text-center">
    You can now log in to IKE Tracker using your new password.
</div>

<div class="d-grid gap-2">
    <a href="/" class="btn btn-success fw-bold py-2">Log In Now</a>
</div>
{% endblock %}
