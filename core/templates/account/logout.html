{% extends 'base_landing.html' %}
{% load static %}

{% block auth_content %}
<div class="text-center mb-4">
    <div class="rounded-circle bg-danger bg-opacity-10 d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px;">
        <i class="fas fa-sign-out-alt fa-2x text-danger"></i>
    </div>
    <h3 class="fw-bold text-white mb-2">Log Out</h3>
    <p class="text-muted small">Are you sure you want to sign out of your account?</p>
</div>

<form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
    {% endif %}
    
    <div class="d-grid gap-2">
        <button type="submit" class="btn btn-danger fw-bold py-2">Sign Out</button>
        <a href="/" class="btn btn-outline-secondary py-2 fw-bold text-muted">Cancel</a>
    </div>
</form>
{% endblock %}
